name: Android APK build

on:
  push:
    branches: [main, stage-1-interface-verification, stage-2/android-storage-integration, feature/media-thumbnails-smart-categories]
  pull_request:
    branches: [main, feature/media-thumbnails-smart-categories]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    name: Build and package FileFlow APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK exists and is non-empty
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"
          sha256sum "$APK" | tee app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FileFlow-debug-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: success()
        run: |
          echo "## FileFlow APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- Variant: Debug" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: FileFlow-debug-APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK: app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_STEP_SUMMARY"
